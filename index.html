<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Nueva misión disponible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --noche: #17112e;
    --panel: #241b4a;
    --borde: #f5f0ff;
    --rosa: #ff5d8f;
    --amarillo: #ffd23f;
    --verde: #3ddc84;
    --sombra: #0b0718;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--noche);
    font-family: "Press Start 2P", "Courier New", monospace;
    font-size: 12px;
    line-height: 1.8;
    color: var(--borde);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .estrella {
    position: fixed;
    width: 3px;
    height: 3px;
    background: var(--borde);
    animation: titilar 2.4s steps(2) infinite;
  }
  @keyframes titilar { 50% { opacity: .15; } }

  .pantalla {
    position: relative;
    width: min(440px, 100%);
    display: grid;
    gap: 14px;
  }
  .caja {
    background: var(--panel);
    border: 4px solid var(--borde);
    box-shadow: 6px 6px 0 var(--sombra);
    padding: 16px;
  }
  .escena { text-align: center; padding-top: 20px; }
  .etiqueta { color: var(--amarillo); font-size: 10px; margin: 0 0 18px; }
  .corazon-grande {
    width: 112px;
    margin: 0 auto 20px;
    display: block;
    animation: flotar 1s steps(2) infinite;
  }
  @keyframes flotar { 50% { transform: translateY(-6px); } }

  .barra-titulo {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    margin-bottom: 6px;
  }
  .barra {
    height: 16px;
    border: 3px solid var(--borde);
    background: var(--sombra);
  }
  #excusas {
    height: 100%;
    width: 100%;
    background: var(--rosa);
    transition: width .3s steps(6);
  }

  #dialogo { margin: 0; min-height: 7.2em; }
  #dialogo::after {
    content: "▼";
    color: var(--amarillo);
    margin-left: 6px;
    animation: titilar 1s steps(2) infinite;
  }

  .menu {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    min-height: 76px;
  }
  button {
    font: inherit;
    font-size: 13px;
    color: var(--sombra);
    border: 4px solid var(--sombra);
    outline: 3px solid var(--borde);
    padding: 12px 20px;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
  }
  #si { background: var(--verde); transition: transform .2s steps(3); }
  #si:active { transform: translateY(3px); }
  #no {
    background: var(--rosa);
    transition: left .2s steps(5), top .2s steps(5);
    z-index: 10;
  }
  #no.rendido { background: var(--verde); }

  #final { text-align: center; padding: 28px 16px; }
  #final h1 { font-size: 16px; color: var(--amarillo); margin: 0 0 16px; line-height: 1.6; }
  #final .premio { color: var(--verde); margin: 0 0 18px; }
  #final p { margin: 0; }

  .lluvia {
    position: fixed;
    top: -40px;
    pointer-events: none;
    animation: caer linear forwards;
  }
  @keyframes caer { to { transform: translateY(115vh); } }
</style>
</head>
<body>

<main class="pantalla">
  <section id="juego" style="display: grid; gap: 14px;">
    <div class="caja escena">
      <p class="etiqueta">★ NUEVA MISIÓN ★</p>
      <div id="corazon"></div>
      <div class="barra-titulo"><span id="barraNombre"></span><span id="barraValor">100%</span></div>
      <div class="barra"><div id="excusas"></div></div>
    </div>

    <div class="caja"><p id="dialogo" aria-live="polite"></p></div>

    <div class="caja menu">
      <button id="si" type="button">▶ SÍ</button>
      <button id="no" type="button" tabindex="-1">NO</button>
    </div>
  </section>

  <section id="final" class="caja" hidden>
    <div id="corazonFinal"></div>
    <h1 id="finalTitulo"></h1>
    <p class="premio" id="finalPremio"></p>
    <p id="finalTexto"></p>
  </section>
</main>

<script>
  // ====== Cambia aquí los textos ======
  const NOMBRE = "Manu";
  const PREGUNTA = "¿quieres salir conmigo?";
  const FINAL_TITULO = "¡MISIÓN CUMPLIDA!";
  const FINAL_PREMIO = "+1 CITA DESBLOQUEADA";
  const FINAL_TEXTO = "Sabía que dirías que sí. Te escribo para cuadrar el día.";
  // Lo que dice el juego cada vez que intenta darle a NO (una por intento)
  const FRASES = [
    "NO usó HUIDA. ¡Es muy eficaz!",
    "¡Fallaste! NO es demasiado rápido.",
    "Pista: el botón verde no muerde.",
    "NO se escondió. ¿Segura que es por ahí?",
    "Tus excusas se están acabando...",
    "Bonus: si dices SÍ, invito yo.",
    "NO está agotado. Ya casi no puede más."
  ];
  const FRASE_RENDIDO = "¡A NO se le acabaron las excusas! Evolucionó a SÍ.";
  // ====================================

  const btnNo = document.getElementById("no");
  const btnSi = document.getElementById("si");
  const dialogo = document.getElementById("dialogo");
  const excusas = document.getElementById("excusas");
  const barraValor = document.getElementById("barraValor");
  const DISTANCIA_HUIDA = 90;
  const INTENTOS_MAX = FRASES.length;
  let intentos = 0;
  let rendido = false;
  let destinoNo = null;
  let ultimoIntento = 0;
  const PAUSA_ENTRE_FRASES = 1500; // milisegundos mínimos entre una frase y la siguiente
  let puntero = { x: -999, y: -999 };

  // Corazón pixelado dibujado a partir de una cuadrícula
  function corazonPixel(color, clase) {
    const forma = [".XX.XX.", "XXXXXXX", "XXXXXXX", ".XXXXX.", "..XXX..", "...X..."];
    let rects = "";
    forma.forEach((fila, y) => [...fila].forEach((c, x) => {
      if (c === "X") rects += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    }));
    return `<svg class="${clase}" viewBox="0 0 7 6" fill="${color}" shape-rendering="crispEdges" aria-hidden="true">${rects}<rect x="1" y="1" width="1" height="1" fill="#fff" opacity=".7"/></svg>`;
  }

  // Texto que se escribe letra por letra, como en los juegos viejos
  let turno = 0;
  function decir(texto) {
    const miTurno = ++turno;
    const letras = [...texto];
    let i = 0;
    dialogo.textContent = "";
    (function paso() {
      if (miTurno !== turno) return;
      dialogo.textContent = letras.slice(0, ++i).join("");
      if (i < letras.length) setTimeout(paso, 26);
    })();
  }

  for (let i = 0; i < 45; i++) {
    const e = document.createElement("i");
    e.className = "estrella";
    e.style.left = Math.random() * 100 + "vw";
    e.style.top = Math.random() * 100 + "vh";
    e.style.animationDelay = Math.random() * 2.4 + "s";
    document.body.prepend(e);
  }
  document.getElementById("corazon").innerHTML = corazonPixel("#ff5d8f", "corazon-grande");
  document.getElementById("barraNombre").textContent = `EXCUSAS DE ${NOMBRE || "TI"}`.toUpperCase();
  decir(`${NOMBRE ? NOMBRE + ", " : ""}${PREGUNTA} ¿Qué vas a hacer?`);

  function seSolapan(a, b, margen) {
    return a.left < b.right + margen && a.right > b.left - margen &&
           a.top < b.bottom + margen && a.bottom > b.top - margen;
  }

  function huir() {
    if (rendido) return;
    const r = btnNo.getBoundingClientRect();

    // La primera vez lo saco del menú para que pueda moverse por toda la pantalla
    if (btnNo.parentElement !== document.body) {
      btnNo.style.position = "fixed";
      btnNo.style.left = r.left + "px";
      btnNo.style.top = r.top + "px";
      document.body.appendChild(btnNo);
      btnNo.getBoundingClientRect(); // fuerza el reflow para que la transición arranque desde aquí
    }

    const margen = 14;
    const maxX = Math.max(margen, window.innerWidth - r.width - margen);
    const maxY = Math.max(margen, window.innerHeight - r.height - margen);
    const si = btnSi.getBoundingClientRect();
    let x = margen, y = margen;

    for (let i = 0; i < 60; i++) {
      x = margen + Math.random() * (maxX - margen);
      y = margen + Math.random() * (maxY - margen);
      const destino = { left: x, top: y, right: x + r.width, bottom: y + r.height };
      const lejosDelPuntero = Math.hypot(x + r.width / 2 - puntero.x, y + r.height / 2 - puntero.y) > 170;
      if (lejosDelPuntero && !seSolapan(destino, si, 16)) break;
    }

    btnNo.style.left = x + "px";
    btnNo.style.top = y + "px";
    destinoNo = { left: x, top: y, right: x + r.width, bottom: y + r.height };

    // Un intento solo cuenta si ya hubo tiempo de leer la frase anterior
    const ahora = Date.now();
    if (ahora - ultimoIntento < PAUSA_ENTRE_FRASES) return;
    ultimoIntento = ahora;

    intentos++;
    const restante = Math.max(0, Math.round(100 * (1 - intentos / (INTENTOS_MAX + 1))));
    excusas.style.width = restante + "%";
    barraValor.textContent = restante + "%";
    btnSi.style.transform = `scale(${Math.min(1 + intentos * 0.06, 1.4)})`;

    if (intentos > INTENTOS_MAX) rendirse();
    else decir(FRASES[intentos - 1]);
  }

  // Cuando se acaban las excusas, el NO se rinde y se vuelve otro SÍ
  function rendirse() {
    rendido = true;
    btnNo.textContent = "▶ SÍ";
    btnNo.classList.add("rendido");
    decir(FRASE_RENDIDO);
  }

  // Mouse: huye apenas el puntero se acerca
  document.addEventListener("pointermove", (e) => {
    puntero = { x: e.clientX, y: e.clientY };
    if (e.pointerType === "touch") return;
    // Mientras se desliza mido contra el destino, para que no huya varias veces seguidas
    const r = destinoNo || btnNo.getBoundingClientRect();
    const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
    const dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
    if (Math.hypot(dx, dy) < DISTANCIA_HUIDA) huir();
  });

  // Celular: huye en cuanto lo tocan, antes de que cuente como clic
  btnNo.addEventListener("pointerdown", (e) => {
    if (rendido) return;
    e.preventDefault();
    puntero = { x: e.clientX, y: e.clientY };
    huir();
  });
  btnNo.addEventListener("touchstart", (e) => { if (!rendido) e.preventDefault(); }, { passive: false });

  // Por si acaso llega un clic o el foco del teclado: tampoco se deja
  btnNo.addEventListener("click", (e) => {
    if (rendido) return ganar();
    e.preventDefault();
    huir();
  });
  btnNo.addEventListener("focus", () => { if (!rendido) { btnNo.blur(); huir(); } });

  // Si giran el celular o cambian el tamaño, que no quede fuera de la pantalla
  window.addEventListener("resize", () => {
    if (btnNo.parentElement !== document.body) return;
    const r = btnNo.getBoundingClientRect();
    btnNo.style.left = Math.max(14, Math.min(r.left, window.innerWidth - r.width - 14)) + "px";
    btnNo.style.top = Math.max(14, Math.min(r.top, window.innerHeight - r.height - 14)) + "px";
    destinoNo = null;
  });

  btnSi.addEventListener("click", ganar);

  function ganar() {
    turno++;
    btnNo.remove();
    document.getElementById("juego").hidden = true;
    document.getElementById("juego").style.display = "none";
    document.getElementById("corazonFinal").innerHTML = corazonPixel("#ff5d8f", "corazon-grande");
    document.getElementById("finalTitulo").textContent = FINAL_TITULO;
    document.getElementById("finalPremio").textContent = FINAL_PREMIO;
    document.getElementById("finalTexto").textContent = FINAL_TEXTO;
    document.getElementById("final").hidden = false;
    lluviaDeCorazones();
  }

  function lluviaDeCorazones() {
    const colores = ["#ff5d8f", "#ffd23f", "#f5f0ff", "#3ddc84"];
    let cantidad = 0;
    const timer = setInterval(() => {
      const c = document.createElement("div");
      c.className = "lluvia";
      c.innerHTML = corazonPixel(colores[Math.floor(Math.random() * colores.length)], "");
      c.style.left = Math.random() * 96 + "vw";
      c.style.width = 14 + Math.random() * 22 + "px";
      c.style.animationDuration = 3 + Math.random() * 3 + "s";
      document.body.appendChild(c);
      c.addEventListener("animationend", () => c.remove());
      if (++cantidad > 90) clearInterval(timer);
    }, 120);
  }
</script>
</body>
</html>
